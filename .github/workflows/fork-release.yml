name: Fork Release

# Fork-friendly release workflow.
#
# Mirrors the official release.yml platform matrix (macOS arm64 + intel,
# Linux x86_64 + aarch64, Windows x86_64) and attaches the same asset types
# to a Release, but without the parts a fork cannot do: the upstream
# WSJTX/wsjtx force-push and its CROSS_REPO_TOKEN secret.
#
# Trigger it from the Actions tab (Fork Release -> Run workflow). The version
# is read from CMakeLists.txt, matching the same source of truth CI uses.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (default: fork-v<version>-b<run number>)"
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          VERSION=$(grep -E '^\s*VERSION\s+[0-9]' CMakeLists.txt | head -1 | awk '{print $2}' | cut -d. -f1-3)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not derive VERSION from CMakeLists.txt"
            exit 1
          fi
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="fork-v${VERSION}-b${GITHUB_RUN_NUMBER}"
          fi
          echo "Derived version: $VERSION"
          echo "Release tag:     $TAG"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  macos-arm64-qt:
    needs: prepare
    uses: ./.github/workflows/prepare-macos-qt.yml
    with:
      arch: "arm64"
      runner: "macos-15"
      deployment_target: "11.0"

  macos-intel-qt:
    needs: prepare
    uses: ./.github/workflows/prepare-macos-qt.yml
    with:
      arch: "x86_64"
      runner: "macos-15-intel"
      deployment_target: "10.13"

  macos:
    needs: [prepare, macos-arm64-qt]
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "arm64"
      runner: "macos-15"
      deployment_target: "11.0"
    secrets: inherit

  macos-intel:
    needs: [prepare, macos-intel-qt]
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "x86_64"
      runner: "macos-15-intel"
      deployment_target: "10.13"
    secrets: inherit

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "x86_64"
    secrets: inherit

  linux-arm:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: "aarch64"
    secrets: inherit

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
    secrets: inherit

  release:
    needs: [prepare, macos, macos-intel, linux, linux-arm, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build source tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git archive \
            --format=tar.gz \
            --prefix="wsjtx-${VERSION}/" \
            -o "artifacts/wsjtx-${VERSION}-src.tar.gz" \
            HEAD

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Report installer-grade artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          labels=(
            "macOS arm64 .pkg"
            "macOS x86_64 .pkg"
            "Linux x86_64 .AppImage"
            "Linux aarch64 .AppImage"
            "Windows x86_64 .exe"
          )
          patterns=(
            "artifacts/wsjtx-${VERSION}-arm64-macOS.pkg/*.pkg"
            "artifacts/wsjtx-${VERSION}-x86_64-macOS.pkg/*.pkg"
            "artifacts/wsjtx-${VERSION}-linux-x86_64-AppImage/*.AppImage"
            "artifacts/wsjtx-${VERSION}-linux-aarch64-AppImage/*.AppImage"
            "artifacts/wsjtx-${VERSION}-windows-x86_64-installer/*.exe"
          )
          missing=0
          echo "Installer-grade artifact summary — checking 5 platforms…"
          for i in "${!labels[@]}"; do
            # shellcheck disable=SC2206 # word-split is intentional; nullglob makes it safe.
            matches=( ${patterns[$i]} )
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::warning::MISSING  ${labels[$i]} — no match for ${patterns[$i]}"
              missing=$((missing + 1))
            else
              size=$(stat --printf '%s' "${matches[0]}")
              printf '  ok  %-22s %s (%s bytes)\n' "${labels[$i]}" "${matches[0]}" "$size"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::warning::$missing of 5 platform(s) missing an installer-grade artifact; publishing a partial release anyway."
          else
            echo "All 5 installer-grade artifacts present."
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          mapfile -t files < <(find artifacts -maxdepth 2 -type f \
            \( -name "*.pkg" -o -name "*.AppImage" -o -name "*.deb" \
               -o -name "*.exe" -o -name "*.tar.gz" -o -name "*.rpm" \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release assets found under artifacts/"
            find artifacts -type f | sort
            exit 1
          fi
          printf 'Publishing %d asset(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "WSJT-X ${VERSION} (fork build)" \
              --generate-notes \
              --prerelease \
              "${files[@]}"
          fi
